<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d64a12" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23d64a12'/><path d='M10 8h9v17h-9z' fill='white'/><path d='M19 12h3l2 3v7a1.5 1.5 0 0 1-3 0v-4h-2' fill='none' stroke='white' stroke-width='2'/><rect x='12' y='10' width='5' height='4' fill='%23d64a12'/></svg>" />
    <title>Fuel Ledger</title>
    <script>
      try {
        var raw = localStorage.getItem('fuel-ledger:data:v1');
        var pref = raw ? JSON.parse(raw).settings.theme : 'system';
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
